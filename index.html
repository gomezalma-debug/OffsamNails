    <style>
      #carouselExampleIndicators .carousel-item img
      {
          height: 300px;/*fija la altura de la imaaen en 300px */
          object-fit: cover;/*asegura que la imagen cubra todo el contenedor */
          border-radius: 12px;
      }
      
      @media(min-width: 786px) 
      {
       #carouselExampleIndicators{ /*Selector del contador pricipal*/
        max-width: 1000px ;/*limita el ancho maximo del carrusel*/
        margin-left: auto;/*Estas propiedades generan margenes automaicas*/
        margin-right: auto;/*la izquierda y derecha para centrar el carrusel*/
        padding: 20px 0;
       }
       #carouselExampleIndicators .carousel-item img {
        height: 550px;
        object-fit: cover;
       }
      }

      .efecto-icono{
        transition: transform 0.3s ease, filter 0.3s ease;
      }
      .efecto-icono:hover{
        transform: translateY(-4px);
        filter: drop-shadow(0px 5px 8px rgba(176, 87, 140, 0.3));
      }

      /* Estilos de la barra de navegación para que funcione el menú desplegable */
      .nav-item {
        transition: transform 0.3s ease;
        margin: 0 3px;
      }
      .nav-item:hover {
        transform: translateY(-2px);
      }
      
      .nav-link {
        color: #6c5f67 !important;
        font-weight: 500;
        border-radius: 6px;
        transition: background-color 0.2s ease;
      }

      .nav-link:hover, .nav-link.active {
          color: #b0578c !important;
          background-color: #fdf2f7;
      }

      .dropdown-item:hover, .dropdown-item.active {
          color: #b0578c !important;
          background-color: #fdf2f7 !important;
      }
     
      .bg-light {
          background-color: #ffffff !important;
      }
      .nav-item:hover
      {
        transform: translateY(-5px);
        box-shadow: 1px 1px 1px;
        z-index: 1050;
      }
      .dropdown-menu
      {
        position: absolute !important;
        z-index: 9999 !important;
        box-shadow: 0px 4px 12px rgba(red);
        border-radius: 8px;
        border: none;
      }
    </style>
</head>
